services:
  mcas-scraper:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./debug:/app/debug
      - ./resources:/app/resources
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=./serviceAccountKey.json
